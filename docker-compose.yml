services:
  db:
    image: postgres:18-alpine
    container_name: scopebridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scopebridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scopebridge
    ports:
      - "55433:5432"
    volumes:
      - scopebridge-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopebridge -d scopebridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Opt-in: `docker compose --profile app up -d --build` serves the app and the
  # built frontend from http://127.0.0.1:8000. Plain `docker compose up -d` still
  # starts only the database, so the uv/pnpm workflow above keeps working.
  app:
    profiles: ["app"]
    build: .
    image: ghcr.io/1634594707/scopebridge:local
    container_name: scopebridge-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://scopebridge:${POSTGRES_PASSWORD}@db:5432/scopebridge
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:8000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      SELLER_EMAIL: ${SELLER_EMAIL:-seller@scopebridge.local}
      SELLER_PASSWORD: ${SELLER_PASSWORD:?set SELLER_PASSWORD in .env}
      CLIENT_EMAIL: ${CLIENT_EMAIL:-client@scopebridge.local}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:?set CLIENT_PASSWORD in .env}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    ports:
      - "8000:8000"

volumes:
  scopebridge-pgdata:
